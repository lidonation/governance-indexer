variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2

stages:
- build

services:
- name: docker:24-dind
  alias: docker
  command: [ "--tls=false" ]

build-indexer-preview:
  stage: build
  image: docker:24.0.7-dind-alpine3.18
  environment:
    name: preview
  variables:
    DOCKER_DRIVER: overlay2
    REGISTRY_IMAGE: registry.2lovelaces.io/voltaire/governance-indexer
    DOCKER_FILE: Dockerfile
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
  - |
    echo "Building indexer preview image..."

    cat $ENV_FILE > .env

    cat $ENV_FILE
    ls -a

    docker build --network host -f $DOCKER_FILE \
      -t "$REGISTRY_IMAGE:preview-$CI_PIPELINE_ID-preview" \
      -t "$REGISTRY_IMAGE:preview" .

    echo "Pushing preview image to registry..."
    docker push "$REGISTRY_IMAGE:preview"
    docker push "$REGISTRY_IMAGE:preview-$CI_PIPELINE_ID-preview"
  rules:
    - if: '$CI_COMMIT_BRANCH != "main"'

build-indexer-prod:
  stage: build
  image: docker:24.0.7-dind-alpine3.18
  environment:
    name: production
  variables:
    DOCKER_DRIVER: overlay2
    REGISTRY_IMAGE: registry.2lovelaces.io/voltaire/governance-indexer
    DOCKER_FILE: Dockerfile
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
  - |
    echo "Building indexer prod image..."

    cat $ENV_FILE > .env

    echo .env
    ls -a

    docker build --network host -f $DOCKER_FILE \
      -t "$REGISTRY_IMAGE:$CI_PIPELINE_ID-prod" \
      -t "$REGISTRY_IMAGE:prod" .

    echo "Pushing prod images to registry..."
    docker push "$REGISTRY_IMAGE:$CI_PIPELINE_ID-prod"
    docker push "$REGISTRY_IMAGE:prod"
  only:
  - main
