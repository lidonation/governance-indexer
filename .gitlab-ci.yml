variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2

stages:
- build

services:
- name: docker:dind
  alias: docker
  command: [ "--tls=false" ]

build-indexer:
  stage: build
  image: docker:25.0.2-git
  variables:
    DOCKER_DRIVER: overlay2
    REGISTRY_IMAGE: $CI_APPLICATION_REPOSITORY/rust-indexer
    DOCKER_FILE: Dockerfile
  before_script:
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
  - |
    echo "Building indexer image..."

    docker build -t $REGISTRY_IMAGE:latest -f $DOCKER_FILE .

    docker build --network host -f $DOCKER_FILE \ 
      -t "$REGISTRY_IMAGE:$CI_PIPELINE_ID" \ 
      -t "$REGISTRY_IMAGE:latest" .

    echo "Pushing image to registry..."
    docker push $REGISTRY_IMAGE:$CI_PIPELINE_ID
    docker push $REGISTRY_IMAGE:latest
  only:
  - main
